[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "battlemind"
version = "0.6.0"
description = "Local, player-visible Pokemon Showdown baseline experiments"
requires-python = ">=3.14,<3.15"
dependencies = ["poke-env==0.16.1", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
train = ["numpy==2.5.2"]

[project.scripts]
battlemind = "battlemind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires the pinned local Showdown server"]
